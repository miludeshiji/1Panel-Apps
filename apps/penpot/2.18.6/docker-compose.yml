x-penpot-common: &penpot-common
  PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI}
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}

x-penpot-database: &penpot-database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD}

services:
  penpot-frontend:
    image: penpotapp/frontend:2.18.6
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-admin-console
      - penpot-mcp
      - penpot-exporter
    environment:
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI}
      PENPOT_FLAGS: ${PENPOT_FLAGS}
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "367001600"
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
    networks:
      - penpot
      - 1panel-network
    labels:
      createdBy: Apps

  penpot-backend:
    image: penpotapp/backend:2.18.6
    restart: unless-stopped
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    environment:
      <<: [*penpot-common, *penpot-database]
      PENPOT_FLAGS: ${PENPOT_FLAGS}
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "367001600"
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_SMTP_HOST: ${PENPOT_SMTP_HOST}
      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT}
      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME}
      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD}
      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_FROM}
      PENPOT_SMTP_TLS: ${PENPOT_SMTP_TLS}
      PENPOT_SMTP_SSL: ${PENPOT_SMTP_SSL}
    networks:
      - penpot
    labels:
      createdBy: Apps

  penpot-admin-console:
    image: penpotapp/admin-console:2.18.6
    restart: unless-stopped
    depends_on:
      penpot-postgres:
        condition: service_healthy
    environment:
      <<: [*penpot-common, *penpot-database]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
    networks:
      - penpot
    labels:
      createdBy: Apps

  penpot-mcp:
    image: penpotapp/mcp:2.18.6
    restart: unless-stopped
    networks:
      - penpot
    labels:
      createdBy: Apps

  penpot-exporter:
    image: penpotapp/exporter:2.18.6
    restart: unless-stopped
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      <<: *penpot-common
      PENPOT_FLAGS: ${PENPOT_FLAGS}
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    networks:
      - penpot
    labels:
      createdBy: Apps

  penpot-postgres:
    image: postgres:15
    restart: unless-stopped
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "penpot", "-d", "penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${PENPOT_DATABASE_PASSWORD}
    networks:
      - penpot
    labels:
      createdBy: Apps

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lfu"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    labels:
      createdBy: Apps

networks:
  penpot:
    driver: bridge
  1panel-network:
    external: true

volumes:
  penpot_postgres_v15:
  penpot_assets:
